[package]
name = "gz-db"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# `macros` is for `#[derive(sqlx::FromRow)]` only -- `query!`/`query_as!` are
# deliberately unused, because they would need a live DATABASE_URL to compile.
# The derive is what lets `CharacterFull`'s row be a named struct: sqlx's tuple
# `FromRow` impls stop at 16 elements and this select has 21.
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
# Slot indices and record sizes are wire facts, not storage decisions: the
# `character_items` schema mirrors the client's 80-entry array, so the two must
# not be able to drift.
gz-proto = { path = "../gz-proto" }
