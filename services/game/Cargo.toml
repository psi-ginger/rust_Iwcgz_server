[package]
name = "game"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gz-cipher = { path = "../../crates/gz-cipher" }
gz-data = { path = "../../crates/gz-data" }
gz-db = { path = "../../crates/gz-db" }
gz-lzf = { path = "../../crates/gz-lzf" }
gz-net = { path = "../../crates/gz-net" }
gz-proto = { path = "../../crates/gz-proto" }
# The monster-AI policy (`gz_sim::ai`): the AFK force-aggro gate the session
# idle clock in `registry.rs` feeds.
gz-sim = { path = "../../crates/gz-sim" }
tokio = { version = "1", features = ["full"] }
# `SlotOccupancy` (the one item question a quest condition asks) and the
# repository seams the quest handlers take are `async_trait` objects, like the
# ones in `gz-db`.
async-trait = "0.1"

[dev-dependencies]
# `MemoryFriends` exercises the 6202 accept handler's persistence seam.
async-trait = "0.1"
# The movement tests build a `LiveFrames`, which carries an item repository but
# never reads it on the step path; a lazy pool keeps them off a database.
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
